# Example Fly.io config for the API. Untested; adjust the app name and origins.
# From the repo root (the Dockerfile copies eval_data/, so the root must be the build context):
#   fly volumes create askdata_data --size 1 -c deploy/fly.toml
#   fly secrets set JWT_SECRET=... ANTHROPIC_API_KEY=... -c deploy/fly.toml
#   fly deploy . -c deploy/fly.toml --dockerfile backend/Dockerfile
#   fly scale count 1 -c deploy/fly.toml      # exactly one machine: in-process locks and limits (D-020)
# Cookies: *.fly.dev is a public suffix, so a UI on another fly.dev app is cross-site and needs
# SameSite=None (blocked by Safari's default third-party cookie rules). Prefer a custom domain
# with the UI and API under one registrable domain (app.example.com + api.example.com) and lax.
app = "askdata-api"
primary_region = "bom"

[env]
  ENVIRONMENT = "prod"
  # Fallback for a UI on another *.fly.dev app (cross-site). With a shared custom domain use "lax".
  COOKIE_SECURE = "true"
  COOKIE_SAMESITE = "none"
  CORS_ORIGINS = '["https://askdata-web.fly.dev"]'
  # Fly's proxy appends the client address to X-Forwarded-For.
  TRUSTED_PROXY_HOPS = "1"

[[mounts]]
  source = "askdata_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/api/v1/health/ready"
    timeout = "5s"
