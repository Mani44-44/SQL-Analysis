name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      LLM_PROVIDER: mock
      DATA_DIR: ${{ github.workspace }}/.ci-data
      DATABASE_URL: sqlite:///${{ github.workspace }}/.ci-data/app.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy app
      - name: Tests (unit, api, security, eval)
        run: uv run pytest -q
        env:
          ENVIRONMENT: test
      - name: Gold SQL check (runs + sqlglot round-trip stable)
        run: uv run python -m app.eval.run --check-gold
      - name: Benchmark harness wiring (deterministic oracle, no API key)
        run: uv run python -m app.eval.run --provider oracle --no-db --out ../eval_runs
      - name: Dependency audit
        run: uvx pip-audit --progress-spinner off -r <(uv export --no-hashes --no-dev --format requirements-txt) || echo "::warning::pip-audit reported issues"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high || echo "::warning::npm audit reported issues"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The CLI scans the whole history every time. The action scans `<first commit>^..`, which
      # fails on a repository's first push.
      - name: Scan full history with gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --verbose .

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Compose interpolates the whole file for every command, so the secret is needed from build on.
      - name: Generate a throwaway JWT secret
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "JWT_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Build images
        run: docker compose build
      - name: Start the stack
        run: docker compose up -d
      - name: Smoke test
        run: |
          for i in $(seq 1 60); do
            curl -fs localhost:8000/api/v1/health/ready && curl -fs -o /dev/null localhost:3000/ && exit 0
            sleep 2
          done
          exit 1
      - name: Demo answers a question
        run: |
          ws=$(curl -fs localhost:8000/api/v1/workspaces | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['id'])")
          curl -fs -X POST "localhost:8000/api/v1/workspaces/$ws/ask" -H 'Content-Type: application/json' \
            -d '{"question": "How much did I spend each month?"}' | python3 -c "import json,sys; r=json.load(sys.stdin); assert r['status']=='ok', r"
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
