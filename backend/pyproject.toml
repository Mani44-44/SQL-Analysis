[project]
name = "askdata-backend"
version = "0.1.0"
description = "AskData: natural-language SQL & data-analysis assistant (backend)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "duckdb>=1.1",
    "sqlglot>=25.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "anthropic>=1,<2",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "sse-starlette>=2.1",
    "pytz>=2026.5",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.110",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E501"]
"app/db/alembic/**" = ["E501"]
"app/demo/**" = ["E501", "S311"]
# report tables / ablation ladders; seeded bootstrap RNG is not crypto
"app/eval/**" = ["E501", "S311"]
# identifiers are always quoted via quote_ident(); values never interpolated
"app/services/ingestion/loader.py" = ["S608"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
exclude = ["app/db/alembic/"]

[[tool.mypy.overrides]]
module = ["app.services.sqlguard.*", "app.services.execution.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
